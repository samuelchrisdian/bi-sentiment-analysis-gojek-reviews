server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA satu halaman: path apa pun dikembalikan ke index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Aset ber-hash aman di-cache selamanya; index.html tidak boleh, supaya
  # rilis berikutnya tidak tertahan cache browser.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
