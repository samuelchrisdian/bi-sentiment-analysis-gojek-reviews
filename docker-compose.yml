services:
  db:
    image: postgres:16-alpine
    container_name: gojek_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gojek}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gojek}
      POSTGRES_DB: ${POSTGRES_DB:-gojek_sentiment}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./ml/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gojek}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      # Konteks = akar repo, bukan ./api: image perlu ml/src (pipeline
      # preprocessing yang diimpor /predict) dan ml/config.yaml.
      context: .
      dockerfile: api/Dockerfile
    container_name: gojek_api
    depends_on:
      db: { condition: service_healthy }
    environment:
      # Di dalam jaringan compose, db dihubungi lewat port INTERNAL 5432 —
      # 5433 di atas hanya pemetaan ke host.
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-gojek}:${POSTGRES_PASSWORD:-gojek}@db:5432/${POSTGRES_DB:-gojek_sentiment}
      ARTIFACTS_DIR: /app/ml/artifacts
    volumes:
      # Read-only: artefak dibuat oleh pipeline Fase 2–4 di host, API hanya
      # membacanya. stem_cache.json ikut di-mount agar /predict tidak
      # menjalankan Sastrawi dari nol untuk kata yang sudah pernah di-stem.
      - ./ml/artifacts:/app/ml/artifacts:ro
      - ./data/processed:/app/data/processed:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        # Dibaca saat BUILD dan di-inline ke dalam bundel. Peramban pengguna
        # yang memanggil API, bukan container web, jadi alamatnya harus alamat
        # yang terlihat dari host — bukan http://api:8000.
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:8000}
    container_name: gojek_web
    depends_on: [api]
    ports:
      # 5173 di host -> 80 (nginx) di container.
      - "5173:80"
    restart: unless-stopped

volumes:
  pgdata:
